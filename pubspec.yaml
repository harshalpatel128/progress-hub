name: progress_hub
description: "ProgressHub - Smart Learning & Goal Tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  shared_preferences: ^2.2.3
  file_picker: ^10.3.7
  share_plus: ^12.0.2
  table_calendar: ^3.1.2
  csv: ^6.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  audioplayers: ^6.8.1
  sqflite_common_ffi: ^2.3.3
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/
    - assets/curriculum/pasted_text.txt
